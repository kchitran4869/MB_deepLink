<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open HiStaff App</title>

<script>
  function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
  }

  function openApp() {
    const ua = navigator.userAgent;
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const isAndroid = /Android/i.test(ua);
    
    const paramValue = getQueryParam('param');
    //console.log("paramvnm", paramValue);
    
    const val = paramValue ? paramValue : 'ApprovalScreen';

    // Device is not mobile → open web
    if (!isIOS && !isAndroid) {
      window.location = "https://hs-portal.vinamilk.com.vn/Attendance/ApproveInfo";
      return;
    }

    // --- iOS Deep Linking ---
    if (isIOS) {
      window.location = "org.reactjs.native.HiStaffOf://" + val;

      setTimeout(() => {
        window.location = "https://apps.apple.com/us/app/histaff/id1485982149";
      }, 1500);

      return;
    }

    // --- ANDROID DEEP LINKING ---
    window.location = "histaff://" + val;

    // Fallback for when the app isn't installed
    setTimeout(() => {
      window.location = "intent://#Intent;scheme=histaff;package=com.histaff;end;";
    }, 800);
  }
</script>

<style>
  body {
    font-family: Arial;
    text-align: center;
    padding-top: 60px;
  }
</style>

</head>

<body onload="openApp()">
  <h2>Đang mở ứng dụng HiStaff...</h2>
</body>
</html>
