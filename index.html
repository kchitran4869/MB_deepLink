<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open HiStaff App</title>

<script>
  function openApp() {
    setTimeout(() => {
      const start = Date.now();

      // --- Detect OS ---
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

      // --- Choose correct scheme ---
      const scheme = isIOS 
        ? "org.reactjs.native.HiStaffOf://" 
        : "histaff://";

      // --- Safari fix ---
      const a = document.createElement('a');
      a.href = scheme;
      a.click();

      // --- Chrome/Android fix ---
      const iframe = document.createElement("iframe");
      iframe.style.display = "none";
      iframe.src = scheme;
      document.body.appendChild(iframe);

      // --- Fallback ---
      setTimeout(() => {
        if (Date.now() - start < 1800) {
          if (isIOS) {
            window.location = "https://apps.apple.com/us/app/histaff/id1485982149";
          } else {
            window.location = "https://play.google.com/store/apps/details?id=com.histaff";
          }
        }
      }, 1800);

    }, 250);
  }
</script>

<style>
  body {
    font-family: Arial;
    text-align: center;
    padding-top: 60px;
  }
</style>

</head>

<body onload="openApp()">
  <h2>Đang mở ứng dụng HiStaff...</h2>
  <p>Nếu ứng dụng không mở, bạn sẽ được chuyển đến App Store hoặc Google Play.</p>
</body>
</html>
