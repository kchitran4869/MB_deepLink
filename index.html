<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open HiStaff App</title>

<script>
  function openApp() {
    const ua = navigator.userAgent;
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const isAndroid = /Android/i.test(ua);

    // Device không phải mobile → mở web
    if (!isIOS && !isAndroid) {
      window.location = "https://hs-portal.vinamilk.com.vn/Attendance/ApproveInfo";
      return;
    }

    // --- iOS Deep Linking ---
    if (isIOS) {
      window.location = "org.reactjs.native.HiStaffOf://";

      setTimeout(() => {
        window.location = "https://apps.apple.com/us/app/histaff/id1485982149";
      }, 1500);

      return;
    }

    // --- ANDROID DEEP LINKING ---
    // 1. Thử mở app bằng custom scheme
    window.location = "histaff://";

    // 2. Dùng intent:// fallback nếu app không cài
    setTimeout(() => {
      window.location = 
        "intent://#Intent;scheme=histaff;package=com.histaff;end;";
    }, 800);
  }
</script>

<style>
  body {
    font-family: Arial;
    text-align: center;
    padding-top: 60px;
  }
</style>

</head>

<body onload="openApp()">
  <h2>Đang mở ứng dụng HiStaff...</h2>
</body>
</html>
