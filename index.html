<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open HiStaff App</title>

<script>
  function openApp() {
    setTimeout(() => {
      const start = Date.now();

      // --- Detect OS ---
      const ua = navigator.userAgent;
      const isIOS = /iPhone|iPad|iPod/i.test(ua);
      const isAndroid = /Android/i.test(ua);

      // --- If NOT Android & NOT iOS => open fallback website immediately ---
      if (!isIOS && !isAndroid) {
        window.location = "https://pvnm24-face-dev.histaff.online/Attendance/ApproveInfo";
        return;
      }

      // --- Choose correct scheme ---
      const scheme = isIOS 
        ? "org.reactjs.native.HiStaffOf://" 
        : "histaff://";

      // --- Safari iOS fix (anchor click) ---
      const a = document.createElement('a');
      a.href = scheme;
      a.click();

      // --- Chrome/Android fix (iframe bypass) ---
      const iframe = document.createElement("iframe");
      iframe.style.display = "none";
      iframe.src = scheme;
      document.body.appendChild(iframe);

      // --- Fallback (app not opened) ---
      setTimeout(() => {
        if (Date.now() - start < 1800) {
          if (isIOS) {
            window.location = "https://apps.apple.com/us/app/histaff/id1485982149";
          } else if (isAndroid) {
            window.location = "https://play.google.com/store/apps/details?id=com.histaff";
          }
        }
      }, 1800);

    }, 250); // Small delay ensures DOM loaded
  }
</script>

<style>
  body {
    font-family: Arial;
    text-align: center;
    padding-top: 60px;
  }
</style>

</head>

<body onload="openApp()">
  <h2>Đang mở ứng dụng HiStaff...</h2>
</body>
</html>
